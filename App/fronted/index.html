<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Churn Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Keeping glass-card style here in case it's not in your style.css */
      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body class="p-4 md:p-8 bg-slate-50">
    <div class="max-w-[95%] mx-auto">
      <header class="mb-8">
        <h1 class="text-3xl font-bold text-slate-800">
          Customer Insights Dashboard
        </h1>
        <p class="text-slate-500">
          Manage customer data and analyze churn predictions.
        </p>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="glass-card p-6 rounded-2xl shadow-sm">
          <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">
            Total Customers
          </p>
          <h3 id="stat-total" class="text-4xl font-bold text-blue-600 mt-2">
            0
          </h3>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-l-green-500">
          <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">
            Active/Stayed
          </p>
          <h3 id="stat-stayed" class="text-4xl font-bold text-green-600 mt-2">
            0
          </h3>
        </div>
        <div class="glass-card p-6 rounded-2xl shadow-sm border-l-4 border-l-red-500">
          <p class="text-sm font-medium text-slate-500 uppercase tracking-wider">
            Churned (Exited)
          </p>
          <h3 id="stat-exited" class="text-4xl font-bold text-red-600 mt-2">
            0
          </h3>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
          <div class="glass-card p-6 rounded-2xl shadow-md sticky top-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">
              Add New Customer
            </h2>
            <form id="customerForm" class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Auto-Generated ID</label>
                  <input type="number" id="customerId" value="1" readonly class="w-full px-3 py-2 border rounded-lg bg-slate-100 text-slate-500 cursor-not-allowed outline-none" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Surname</label>
                  <input type="text" id="surname" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Credit Score (350-850)</label>
                  <input type="number" id="creditScore" min="350" max="850" value="650" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Geography</label>
                  <select id="geography" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Spain">Spain</option>
                  </select>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Gender</label>
                  <select id="gender" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Age (18-92)</label>
                  <input type="number" id="age" min="18" max="92" value="35" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Tenure (0-10)</label>
                  <input type="number" id="tenure" min="0" max="10" value="5" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Products (1-4)</label>
                  <input type="number" id="numProducts" min="1" max="4" value="1" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Balance ($)</label>
                <input type="number" id="balance" step="0.01" min="0" value="0" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Estimated Salary</label>
                <input type="number" id="salary" step="0.01" min="0" value="50000" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all" />
              </div>

              <div class="flex items-center space-x-4 pt-2">
                <label class="flex items-center text-sm text-slate-600 cursor-pointer">
                  <input type="checkbox" id="hasCrCard" class="mr-2 rounded" />
                  Card Holder
                </label>
                <label class="flex items-center text-sm text-slate-600 cursor-pointer">
                  <input type="checkbox" id="isActive" class="mr-2 rounded" />
                  Active Member
                </label>
              </div>

              <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg mt-4">
                Predict & Add Customer
              </button>
            </form>
          </div>
        </div>

        <div class="lg:col-span-2">
          <div class="glass-card rounded-2xl shadow-md overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
              <h2 class="text-xl font-semibold text-slate-800">
                Customer Data & Predictions
              </h2>
              <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-bold uppercase tracking-tight">Real-time Feed</span>
            </div>
            
            <div class="relative">
              <div class="overflow-x-auto overflow-y-auto max-h-[600px]">
                <table class="w-full text-left border-collapse min-w-full">
                  <thead class="sticky top-0 bg-slate-50 z-10">
                    <tr class="text-slate-500 text-xs uppercase tracking-wider">
                      <th class="px-6 py-4 font-semibold">ID</th>
                      <th class="px-6 py-4 font-semibold">Customer</th>
                      <th class="px-6 py-4 font-semibold">Score</th>
                      <th class="px-6 py-4 font-semibold">Location</th>
                      <th class="px-6 py-4 font-semibold">Products</th>
                      <th class="px-6 py-4 font-semibold">Status</th>
                      <th class="px-6 py-4 font-semibold">Prediction</th>
                      <th class="px-6 py-4 font-semibold">Probability</th>
                    </tr>
                  </thead>
                  <tbody id="dataTableBody" class="divide-y divide-slate-100 bg-white">
                    </tbody>
                </table>
              </div>

              <div id="emptyState"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="messageBox" class="fixed bottom-8 right-8 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
      <div class="bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
        <span id="messageIcon">✅</span>
        <span id="messageText">Customer added!</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
